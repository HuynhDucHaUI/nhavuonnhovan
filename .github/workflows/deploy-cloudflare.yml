name: Deploy personal Cloudflare Worker

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: cloudflare-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_DATABASE_NAME: nhavuonnhovan-production
      CLOUDFLARE_R2_BUCKET_NAME: nhavuonnhovan-images
      CLOUDFLARE_WORKER_NAME: nhavuonnhovan

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Worker
        run: npm run build

      - name: Apply D1 migrations
        run: node scripts/apply-d1-migrations.mjs

      - name: Deploy Worker
        run: npx wrangler deploy --config dist/server/wrangler.json --route "nhavuonnhovan.io.vn/*"
